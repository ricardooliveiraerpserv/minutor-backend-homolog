name: Build + deploy HOMOLOG (ServerSpace)

# HOMOLOG roda no VPS ServerSpace SP (minutor-dev2, 92.246.128.204), ao lado da DEV2 mas isolado.
# Só a branch main (dev e dev2 deste repo NÃO deployam aqui). Push → GHCR → pull/up no VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-homolog
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ricardooliveiraerpserv/minutor-backend-homolog'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ricardooliveiraerpserv/minutor-backend-homolog:latest
            ghcr.io/ricardooliveiraerpserv/minutor-backend-homolog:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/ricardooliveiraerpserv/minutor-backend-homolog:buildcache
          cache-to: type=registry,ref=ghcr.io/ricardooliveiraerpserv/minutor-backend-homolog:buildcache,mode=max

  deploy:
    needs: build
    if: github.repository == 'ricardooliveiraerpserv/minutor-backend-homolog'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull + up no VPS (homolog)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HOMOLOG_VPS_HOST }}
          username: root
          key: ${{ secrets.HOMOLOG_VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,SHA
          command_timeout: 15m
          script: |
            set -e
            cd /opt/minutor-homolog
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose --profile jobs pull backend cron
            docker compose up -d --no-deps backend; if docker ps -a --format "{{.Names}}" | grep -q minutor-homolog-cron; then docker compose --profile jobs up -d --no-deps cron; fi
            docker logout ghcr.io
            for i in $(seq 1 40); do
              if docker exec minutor-homolog-backend curl -sf http://localhost:8080/up >/dev/null; then echo "OK $SHA"; break; fi
              sleep 5
            done
            docker exec minutor-homolog-backend curl -sf http://localhost:8080/up >/dev/null
            docker image prune -f >/dev/null
