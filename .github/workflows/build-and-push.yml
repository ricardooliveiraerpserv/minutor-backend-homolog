name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Roda apenas no repo de produção (Leonardo-almd/minutor-backend).
    # No repo homolog (ricardooliveiraerpserv/minutor-backend-homolog) o
    # workflow é ignorado — Render builda e roda automaticamente.
    if: github.repository == 'Leonardo-almd/minutor-backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/leonardo-almd/minutor-backend:latest
            ghcr.io/leonardo-almd/minutor-backend:${{ github.sha }}
          # Cache no GHCR (registry) — mais consistente que type=gha.
          cache-from: type=registry,ref=ghcr.io/leonardo-almd/minutor-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/leonardo-almd/minutor-backend:buildcache,mode=max
