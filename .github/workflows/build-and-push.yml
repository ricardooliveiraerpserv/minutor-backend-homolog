name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Roda apenas no repo de producao (erpserv-clientes/minutor-backend).
    # No repo homolog (ricardooliveiraerpserv/minutor-backend-homolog) o
    # workflow e ignorado — Render builda e roda automaticamente.
    if: github.repository == 'erpserv-clientes/minutor-backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/erpserv-clientes/minutor-backend:latest
            ghcr.io/erpserv-clientes/minutor-backend:${{ github.sha }}
          # Cache no GHCR (registry) — mais consistente que type=gha.
          cache-from: type=registry,ref=ghcr.io/erpserv-clientes/minutor-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/erpserv-clientes/minutor-backend:buildcache,mode=max

  # ── Deploy automatico no VPS (ServerSpace) apos a imagem estar no GHCR ──
  # Requer secrets no repo: VPS_HOST, VPS_USER, VPS_SSH_KEY (chave privada SSH),
  # e opcional VPS_PORT (default 22). Enquanto os secrets nao existirem, o job
  # falha so nesta etapa — o build/push da imagem continua funcionando.
  deploy:
    needs: build
    if: github.repository == 'erpserv-clientes/minutor-backend'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy no VPS (login GHCR + pull + up + migrate)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin || true
            cd /opt/minutor
            # So backend (frontend e Vercel; imagem do front no GHCR nem existe).
            docker compose pull backend queue-worker scheduler
            docker compose up -d --no-deps backend queue-worker scheduler
            # entrypoint do container ja roda migrate no start; este e reforco idempotente.
            docker exec minutor-backend php artisan migrate --force || true
            docker exec minutor-backend php artisan optimize
            docker image prune -af || true
